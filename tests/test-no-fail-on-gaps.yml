name: Test fail-on-gaps false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: '.'
          fail-on-gaps: 'false'
      - name: Assert action succeeded and gaps output is numeric
        env:
          GAPS: ${{ steps.action.outputs.gaps }}
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "gaps: $GAPS"
          echo "score: $SCORE"
          if ! echo "$GAPS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: gaps '$GAPS' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: action completed without failing even if gaps exist, gaps=$GAPS"
