name: Test custom scan-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create two directories - one with agent files, one without
        run: |
          # Directory with agent file
          mkdir -p /tmp/scan-subdir/agents
          cat > /tmp/scan-subdir/agents/my_agent.py << 'EOF'
          from crewai import Agent

          agent = Agent(role="researcher")
          EOF

          # Directory without agent files (just plain Python)
          mkdir -p /tmp/scan-subdir/utils
          echo "def helper(): pass" > /tmp/scan-subdir/utils/helper.py

      - name: Scan only the utils subdirectory (no agents)
        id: scan-utils
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/scan-subdir/utils
          fail-on-gaps: 'false'

      - name: Assert utils scan finds 0 agent files
        env:
          ACTUAL: ${{ steps.scan-utils.outputs.agent-files }}
        run: |
          echo "actual agent-files: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected agent-files=0 when scanning utils dir, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Scan only the agents subdirectory
        id: scan-agents
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/scan-subdir/agents
          fail-on-gaps: 'false'

      - name: Assert agents scan finds 1 agent file
        env:
          ACTUAL: ${{ steps.scan-agents.outputs.agent-files }}
        run: |
          echo "actual agent-files: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected agent-files=1 when scanning agents dir, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert score and report are set for agents scan
        env:
          SCORE: ${{ steps.scan-agents.outputs.score }}
          REPORT: ${{ steps.scan-agents.outputs.report }}
        run: |
          echo "score: $SCORE"
          echo "report length: ${#REPORT}"
          if [ -z "$SCORE" ]; then
            echo "FAIL: score output is empty"
            exit 1
          fi
          if [ -z "$REPORT" ]; then
            echo "FAIL: report output is empty"
            exit 1
          fi
          echo "PASS"
