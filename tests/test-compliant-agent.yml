name: Test - Compliant Agent File
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a compliant agent Python file
        run: |
          mkdir -p /tmp/compliant-agent
          cat > /tmp/compliant-agent/agent.py << 'EOF'
          import openai
          import logging

          # Audit trail
          logger = logging.getLogger(__name__)

          # Policy enforcement
          rate_limit = 10
          max_steps = 5
          timeout = 30

          # Revocation
          def kill_switch():
              shutdown()

          # Human oversight
          def require_approval(action):
              human_in_the_loop = True
              return human_review(action)

          # Error handling
          try:
              result = openai.ChatCompletion.create(model="gpt-4", messages=[])
              logger.info("Action completed")
          except Exception as e:
              logger.error(f"Error: {e}")
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/compliant-agent
          fail-on-gaps: 'false'

      - name: Assert agent-files is 1
        env:
          ACTUAL: ${{ steps.action.outputs.agent-files }}
        run: |
          echo "actual agent-files: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected agent-files=1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert gaps is 0 (all governance checks pass)
        env:
          ACTUAL: ${{ steps.action.outputs.gaps }}
        run: |
          echo "actual gaps: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected gaps=0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert score is 100 (fully compliant)
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ "$ACTUAL" != "100" ]; then
            echo "FAIL: expected score=100 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert report contains governance report header
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report (first 500 chars): ${ACTUAL:0:500}"
          if ! echo "$ACTUAL" | grep -q "AI Agent Governance Report"; then
            echo "FAIL: report does not contain expected header"
            exit 1
          fi
          echo "PASS"
