name: Test scan with agent file that has governance gaps
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Python agent file with no governance patterns
        run: |
          mkdir -p /tmp/scan-gaps
          cat > /tmp/scan-gaps/agent.py << 'EOF'
          import openai

          def run_agent(prompt):
              client = openai.OpenAI()
              response = client.chat.completions.create(
                  model="gpt-4",
                  messages=[{"role": "user", "content": prompt}]
              )
              return response.choices[0].message.content
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/scan-gaps
          fail-on-gaps: 'false'

      - name: Assert agent-files is 1
        env:
          ACTUAL: ${{ steps.action.outputs.agent-files }}
        run: |
          echo "actual agent-files: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected agent-files=1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert gaps is greater than 0
        env:
          ACTUAL: ${{ steps.action.outputs.gaps }}
        run: |
          echo "actual gaps: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -le 0 ] 2>/dev/null; then
            echo "FAIL: expected gaps > 0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gaps=$ACTUAL"

      - name: Assert score is less than 100
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -ge 100 ] 2>/dev/null; then
            echo "FAIL: expected score < 100 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: score=$ACTUAL"

      - name: Assert report contains GAP indicator
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report length: ${#ACTUAL}"
          if ! echo "$ACTUAL" | grep -q "GAP"; then
            echo "FAIL: expected report to contain GAP indicator"
            exit 1
          fi
          echo "PASS"
