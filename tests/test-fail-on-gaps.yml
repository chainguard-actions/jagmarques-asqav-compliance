name: Test - Fail On Gaps
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a non-compliant agent Python file
        run: |
          mkdir -p /tmp/fail-on-gaps-agent
          cat > /tmp/fail-on-gaps-agent/bare_agent.py << 'EOF'
          import langchain

          # Bare agent with no governance controls
          def run():
              chain = langchain.LLMChain()
              return chain.run("Do something risky")
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/fail-on-gaps-agent
          fail-on-gaps: 'true'

      - name: Assert action failed due to gaps
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail-on-gaps=true and gaps exist, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when gaps were found"

      - name: Assert gaps output is greater than 0
        env:
          ACTUAL: ${{ steps.action.outputs.gaps }}
        run: |
          echo "actual gaps: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -le 0 ] 2>/dev/null; then
            echo "FAIL: expected gaps>0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gaps=$ACTUAL (>0 as expected)"
