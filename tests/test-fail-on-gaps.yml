name: Test fail-on-gaps behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Python agent file with governance gaps
        run: |
          mkdir -p /tmp/scan-fail
          cat > /tmp/scan-fail/bare_agent.py << 'EOF'
          import langchain

          def run():
              # No audit trail, no policy, no revocation, no human oversight, no error handling
              pass
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/scan-fail
          fail-on-gaps: 'true'

      - name: Assert action failed due to gaps
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail-on-gaps=true and gaps exist, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to governance gaps"

      - name: Assert gaps output is greater than 0
        env:
          ACTUAL: ${{ steps.action.outputs.gaps }}
        run: |
          echo "actual gaps: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -le 0 ] 2>/dev/null; then
            echo "FAIL: expected gaps > 0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gaps=$ACTUAL"
