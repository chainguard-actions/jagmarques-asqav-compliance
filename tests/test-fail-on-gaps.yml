name: Test - Fail On Gaps
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python agent file with governance gaps
        run: |
          mkdir -p /tmp/fail-gap-agent
          cat > /tmp/fail-gap-agent/agent.py << 'EOF'
          import openai

          def run_agent():
              # No audit trail, no policy, no revocation, no human oversight, no error handling
              client = openai.OpenAI()
              response = client.chat.completions.create(
                  model="gpt-4",
                  messages=[{"role": "user", "content": "Hello"}]
              )
              return response
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/fail-gap-agent
          fail-on-gaps: 'true'

      - name: Assert action failed due to gaps
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail-on-gaps=true and gaps exist, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when gaps were found"

      - name: Assert gaps output is greater than 0
        env:
          ACTUAL: ${{ steps.action.outputs.gaps }}
        run: |
          echo "actual gaps: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -le 0 ] 2>/dev/null; then
            echo "FAIL: expected gaps > 0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: gaps=$ACTUAL"
