name: Test basic scan with no agent files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a scan directory with no Python agent files
        run: |
          mkdir -p /tmp/scan-empty
          echo "# just a readme" > /tmp/scan-empty/README.md
          echo "x = 1" > /tmp/scan-empty/plain.py

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          scan-path: /tmp/scan-empty
          fail-on-gaps: 'false'

      - name: Assert score is 100 (no agents = perfect score)
        env:
          ACTUAL: ${{ steps.action.outputs.score }}
        run: |
          echo "actual score: $ACTUAL"
          if [ "$ACTUAL" != "100" ]; then
            echo "FAIL: expected score=100 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert agent-files is 0
        env:
          ACTUAL: ${{ steps.action.outputs.agent-files }}
        run: |
          echo "actual agent-files: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected agent-files=0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert gaps is 0
        env:
          ACTUAL: ${{ steps.action.outputs.gaps }}
        run: |
          echo "actual gaps: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected gaps=0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert report mentions no agent frameworks detected
        env:
          ACTUAL: ${{ steps.action.outputs.report }}
        run: |
          echo "actual report: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qi "No AI agent framework usage detected"; then
            echo "FAIL: expected report to mention no agent frameworks"
            exit 1
          fi
          echo "PASS"
